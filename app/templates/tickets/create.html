{% extends "base.html" %}

{% block title %}
Create Ticket - HelpDesk
{% endblock %}


{% block body %}

<div class="shell">

    {% include "partials/sidebar.html" %}

    <main class="content">

        <header class="top">

            <div>

                <h1>
                    Create Ticket
                </h1>

                <p class="muted">
                    Submit a new support request
                </p>

            </div>


            <a
                class="btn ghost"
                href="/tickets"
            >
                Back
            </a>

        </header>


        <section class="panel form-panel">

            <form
                id="createTicketForm"
                class="form grid2"
            >

                <div class="span2">

                    <label>
                        Title
                    </label>

                    <input
                        id="title"
                        maxlength="255"
                        required
                    >

                </div>


                <div class="span2">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="6"
                    ></textarea>

                </div>


                <div>

                    <label>
                        Category
                    </label>

                    <select id="category">

                        <option>
                            IT
                        </option>

                        <option>
                            HR
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Priority
                    </label>

                    <select id="priority">

                        <option>
                            Low
                        </option>

                        <option selected>
                            Medium
                        </option>

                        <option>
                            High
                        </option>

                        <option>
                            Critical
                        </option>

                    </select>

                </div>


                <div class="span2">

                    <button class="btn primary">
                        Create Ticket
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', filename='js/tickets.js') }}"
></script>

{% endblock %}
